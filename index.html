<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center</title>
    <style>
        body { background: #0a0a14; color: #fff; font-family: monospace; padding: 15px; }
        .box { background: #11111d; border: 1px solid #232338; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        h1 { color: #00e5ff; font-size: 18px; text-align: center; }
        .status { color: #ffcc00; font-weight: bold; }
        .val { color: #00ff88; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>
    <h1>ADMIN COMMAND CENTER</h1>
    
    <div class="box">
        <h3>🎬 CLIPCOIN</h3>
        <p>Status: <span id="cc-status" class="status">...</span></p>
        <p>Saldo: <span id="cc-saldo" class="val">$0.00</span></p>
    </div>

    <div class="box">
        <h3>🎰 LUCKYWATCH</h3>
        <p>Status: <span id="lw-status" class="status">...</span></p>
        <p>Saldo: <span id="lw-saldo" class="val">$0.00</span></p>
    </div>

    <!-- Hidden iframe to bypass CORS -->
    <iframe id="dataFrame" style="display:none;" src="https://cryptoretjeh.github.io/Termux/data.html"></iframe>

    <script>
        const frame = document.getElementById('dataFrame');
        
        frame.onload = function() {
            try {
                // Ambil isi teks dari dalam iframe
                const text = frame.contentDocument.body.innerText;
                // Ubah teks jadi JSON
                const data = JSON.parse(text);
                
                // Update UI
                document.getElementById('cc-status').innerText = data.clipcoin.status;
                document.getElementById('cc-saldo').innerText = "$" + parseFloat(data.clipcoin.saldo).toFixed(5);
                
                document.getElementById('lw-status').innerText = data.luckywatch.status;
                document.getElementById('lw-saldo').innerText = "$" + parseFloat(data.luckywatch.saldo).toFixed(5);
            } catch(e) {
                console.log("Menunggu data update...", e);
            }
        }
        
        // Reload iframe tiap 3 detik
        setInterval(() => {
            frame.src = "https://cryptoretjeh.github.io/Termux/data.html?t=" + new Date().getTime();
        }, 3000);
    </script>
</body>
</html>
