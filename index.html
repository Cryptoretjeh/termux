<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        :root { --bg: #0a0a14; --panel: #11111d; --border: #232338; --text: #e2e8f0; --neon-cyan: #00e5ff; --neon-purple: #b026ff; --neon-pink: #ff007f; --neon-green: #00ff88; --neon-yellow: #ffcc00; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; padding: 10px; gap: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--neon-cyan); padding: 10px 15px; border-radius: 6px; flex-shrink: 0; height: 55px; }
        .title { font-size: 15px; font-weight: 800; color: #fff; }
        .title span { color: var(--neon-cyan); }
        .total-balance { font-size: 22px; font-weight: 800; color: var(--neon-green); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .main-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr 1.2fr; gap: 10px; flex-grow: 1; min-height: 0; }
        .card { background-color: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; position: relative; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
        .card.cyan::before { background: var(--neon-cyan); }
        .card.purple::before { background: var(--neon-purple); }
        .card.pink::before { background: var(--neon-pink); }
        .card.yellow::before { background: var(--neon-yellow); }
        .card-title { font-size: 10px; font-weight: bold; color: #aaa; margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 11px; }
        .data-label { color: #777; }
        .data-val { font-weight: bold; color: #fff; }
        .big-val { font-size: 18px; font-weight: 800; margin-top: 4px; }
        .val-cyan { color: var(--neon-cyan); }
        .val-green { color: var(--neon-green); }
        .bar-bg { background: #1a1a2e; height: 5px; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--neon-cyan); }
        .terminal { background: #080810; border: 1px solid var(--border); border-radius: 4px; flex-grow: 1; padding: 8px; font-size: 10px; overflow-y: auto; color: #ccc; }
        .log-line { margin-bottom: 3px; }
        .log-cyan { color: var(--neon-cyan); }
        .log-red { color: var(--neon-pink); }
        .blink { animation: blink 1s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.2; } }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="title">ADMIN <span>COMMAND</span> CENTER</div>
            <div style="font-size:9px; color:#888;">STATUS: <span style="color:var(--neon-green);">ONLINE</span> | UPTIME: <span id="uptime">00:00:00</span></div>
        </div>
        <div style="text-align: right;">
            <div style="font-size:8px; color:#888;">TOTAL ESTIMASI</div>
            <div class="total-balance" id="total-saldo">$0.00000</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="card pink">
            <div class="card-title">🎬 CLIPCOIN <span id="cc-status" style="color:var(--neon-yellow);">...</span></div>
            <div class="data-row"><span class="data-label">Claims</span><span class="data-val" id="cc-claims">0</span></div>
            <div style="margin-top:auto;"><div class="big-val val-green" id="cc-saldo">$0.00</div></div>
        </div>
        <div class="card cyan">
            <div class="card-title">🎰 LUCKYWATCH <span id="lw-status" style="color:#888;">...</span></div>
            <div class="data-row"><span class="data-label">Claims</span><span class="data-val" id="lw-claims">0</span></div>
            <div style="margin-top:auto;"><div class="big-val val-cyan" id="lw-saldo">$0.00</div></div>
        </div>
        <div class="card yellow">
            <div class="card-title">🔑 CAPTCHA API</div>
            <div class="data-row"><span class="data-label">Tokens</span><span class="data-val" id="cap-token">0</span></div>
        </div>
        <div class="card cyan">
            <div class="card-title">💻 SYSTEM HEALTH</div>
            <div class="data-row"><span class="data-label">CPU</span><span class="data-val" id="cpu-val">0%</span></div>
            <div class="bar-bg"><div class="bar-fill" id="cpu-bar" style="width:0%;"></div></div>
        </div>
        <div class="card purple">
            <div class="card-title">📡 NETWORK STATUS</div>
            <div class="data-row"><span class="data-label">Ping</span><span class="data-val" id="net-ping">0ms</span></div>
        </div>
        <div class="card purple">
            <div class="card-title">🤖 BOT LAINNYA</div>
            <div class="data-row"><span class="data-label">Status</span><span class="data-val" id="slot-status">OFFLINE</span></div>
        </div>
        <div class="card" style="grid-column: span 3;">
            <div class="card-title">📟 LIVE TERMINAL <span class="blink" style="color:var(--neon-pink);">● REC</span></div>
            <div class="terminal" id="terminal">
                <div class="log-line"><span class="log-cyan">[System]</span> Menginisialisasi koneksi...</div>
            </div>
        </div>
    </div>

    <script>
        // PASTIKAN URL INI SESUAI DENGAN REPO GITHUB LU
        const JSON_URL = "https://raw.githubusercontent.com/Cryptoretjeh/Termux/main/data.json";
        let lastStatus = "";
        let startTime = Math.floor(Date.now() / 1000);

        setInterval(() => {
            let sec = Math.floor(Date.now() / 1000) - startTime;
            document.getElementById('uptime').innerText = String(Math.floor(sec/3600)).padStart(2,'0') + ":" + String(Math.floor((sec%3600)/60)).padStart(2,'0') + ":" + String(sec%60).padStart(2,'0');
        }, 1000);

        function addLog(msg, isError = false) {
            const term = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString('id-ID', {hour12:false});
            let div = document.createElement('div');
            div.className = 'log-line';
            div.innerHTML = `<span style="color:#555;">[${time}]</span> > <span class="${isError ? 'log-red' : 'log-cyan'}">${msg}</span>`;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
            if(term.children.length > 30) term.removeChild(term.firstChild);
        }

        async function fetchDashboard() {
            try {
                const response = await fetch(JSON_URL + "?t=" + new Date().getTime());
                if (!response.ok) throw new Error("HTTP Error " + response.status);
                const data = await response.json();

                if(!data || !data.clipcoin) {
                    addLog("Format JSON salah / Kosong!", true);
                    return;
                }

                document.getElementById('cc-status').innerText = data.clipcoin.status;
                document.getElementById('cc-status').style.color = data.clipcoin.status === "WATCHING" ? "var(--neon-yellow)" : "var(--neon-green)";
                document.getElementById('cc-claims').innerText = data.clipcoin.claims || 0;
                document.getElementById('cc-saldo').innerText = "$" + parseFloat(data.clipcoin.saldo || 0).toFixed(5);

                document.getElementById('lw-status').innerText = data.luckywatch.status;
                document.getElementById('lw-status').style.color = data.luckywatch.status === "WATCHING" ? "var(--neon-yellow)" : "var(--neon-green)";
                document.getElementById('lw-claims').innerText = data.luckywatch.claims || 0;
                document.getElementById('lw-saldo').innerText = "$" + parseFloat(data.luckywatch.saldo || 0).toFixed(5);

                let total = parseFloat(data.clipcoin.saldo || 0) + parseFloat(data.luckywatch.saldo || 0);
                document.getElementById('total-saldo').innerText = "$" + total.toFixed(5);

                document.getElementById('cpu-val').innerText = data.system.cpu + "%";
                document.getElementById('cpu-bar').style.width = data.system.cpu + "%";
                document.getElementById('net-ping').innerText = data.system.ping + "ms";
                document.getElementById('cap-token').innerText = data.captcha.token;
                document.getElementById('slot-status').innerText = data.slot.status;

                let currentStatus = `${data.clipcoin.status}-${data.luckywatch.status}`;
                if(currentStatus !== lastStatus) {
                    if(data.clipcoin.status === "WATCHING") addLog("ClipCoin: Menonton video...");
                    if(data.luckywatch.status === "WATCHING") addLog("LuckyWatch: Menonton video...");
                    if(data.clipcoin.status === "IDLE" && data.luckywatch.status === "IDLE") addLog("Bot Idle. Menunggu instruksi...");
                    lastStatus = currentStatus;
                }
            } catch (error) {
                console.error(error);
                addLog("Gagal load data dari GitHub. Cek Internet.", true);
            }
        }

        fetchDashboard();
        setInterval(fetchDashboard, 3000);
    </script>
</body>
</html>
