<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Command Center</title>
    <style>
        body { background: #0a0a14; color: #fff; font-family: monospace; padding: 20px; }
        .box { background: #11111d; padding: 15px; border: 1px solid #232338; border-radius: 8px; margin-bottom: 10px; }
        h1 { color: #00e5ff; font-size: 20px; margin-bottom: 15px; }
        h3 { color: #aaa; font-size: 14px; margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        .val { color: #00ff88; font-weight: bold; font-size: 18px; }
        .status { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <h1>ADMIN COMMAND CENTER</h1>
    
    <div class="box">
        <h3>🎬 CLIPCOIN</h3>
        <p>Status: <span id="cc-status" class="status">Loading...</span></p>
        <p>Saldo: <span id="cc-saldo" class="val">$0.00</span></p>
    </div>

    <div class="box">
        <h3>🎰 LUCKYWATCH</h3>
        <p>Status: <span id="lw-status" class="status">Loading...</span></p>
        <p>Saldo: <span id="lw-saldo" class="val">$0.00</span></p>
    </div>

    <div class="box">
        <h3>🔑 CAPTCHA API</h3>
        <p>Tokens: <span id="cap-token" class="val">0</span></p>
    </div>

    <div class="box" style="background:#000;">
        <h3 style="color:#00ff88;">📟 LIVE LOG</h3>
        <div id="log" style="font-size:12px; color:#aaa; height:100px; overflow-y:auto;">
            [System] Menunggu koneksi...
        </div>
    </div>

    <script>
        // URL JSONBIN LU
        const JSON_URL = "https://api.jsonbin.io/v3/b/6af27c87ffd5d16053b54d10";
        const MASTER_KEY = "$2a$10$8CPn3w2fUfEZppHTjHcO8OlEV6GQYDtZNIyhCBY1.npnFXNBKVIa6";

        function addLog(msg) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<br>[${time}] ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // FUNGSI AMBIL DATA DENGAN METODE PALING AMAN (XHR)
        function getData() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", JSON_URL + "?t=" + new Date().getTime(), true); // Anti-cache
            
            // Set header wajib
            xhr.setRequestHeader("X-Master-Key", MASTER_KEY);
            xhr.setRequestHeader("Content-Type", "application/json");

            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var response = JSON.parse(xhr.responseText);
                        var data = response.record;

                        if(data && data.clipcoin) {
                            // Update UI
                            document.getElementById('cc-status').innerText = data.clipcoin.status;
                            document.getElementById('cc-saldo').innerText = "$" + parseFloat(data.clipcoin.saldo || 0).toFixed(5);
                            document.getElementById('lw-status').innerText = data.luckywatch.status;
                            document.getElementById('lw-saldo').innerText = "$" + parseFloat(data.luckywatch.saldo || 0).toFixed(5);
                            document.getElementById('cap-token').innerText = data.captcha.token;
                        } else {
                            addLog("Data kosong atau format salah.");
                        }
                    } catch(e) {
                        addLog("Error baca JSON: " + e.message);
                    }
                } else {
                    addLog("Gagal ambil data. Status: " + xhr.status);
                }
            };
            
            xhr.onerror = function() {
                addLog("Koneksi jaringan terputus.");
            };

            xhr.send();
        }

        // Jalankan tiap 3 detik
        setInterval(getData, 3000);
        getData(); // Jalankan pertama kali
    </script>
</body>
</html>
