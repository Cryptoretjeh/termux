 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center</title>
    <style>
        body { background: #0a0a14; color: #fff; font-family: monospace; padding: 20px; }
        .box { background: #11111d; padding: 20px; border: 1px solid #232338; border-radius: 8px; margin-bottom: 15px; }
        h1 { color: #00e5ff; font-size: 22px; text-align: center; margin-bottom: 20px; }
        h3 { color: #aaa; margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 5px;}
        .status { color: #ffcc00; font-weight: bold; }
        .val { color: #00ff88; font-weight: bold; font-size: 22px; }
    </style>
</head>
<body>
    <h1>ADMIN COMMAND CENTER</h1>
    
    <div class="box">
        <h3>🎬 CLIPCOIN</h3>
        <p>Status: <span id="cc-status" class="status">...</span></p>
        <p>Saldo: <span id="cc-saldo" class="val">$0.00</span></p>
    </div>

    <div class="box">
        <h3>🎰 LUCKYWATCH</h3>
        <p>Status: <span id="lw-status" class="status">...</span></p>
        <p>Saldo: <span id="lw-saldo" class="val">$0.00</span></p>
    </div>

    <script>
        // NPOINT URL LU
        const JSON_URL = "https://api.npoint.io/c34c77001e31bcce50f0";

        async function getData() {
            try {
                // Tambah ?t= biar gak kena cache Chrome
                const res = await fetch(JSON_URL + "?t=" + new Date().getTime());
                const data = await res.json();

                if(data && data.clipcoin) {
                    document.getElementById('cc-status').innerText = data.clipcoin.status;
                    document.getElementById('cc-saldo').innerText = "$" + parseFloat(data.clipcoin.saldo || 0).toFixed(5);
                }
                
                if(data && data.luckywatch) {
                    document.getElementById('lw-status').innerText = data.luckywatch.status;
                    document.getElementById('lw-saldo').innerText = "$" + parseFloat(data.luckywatch.saldo || 0).toFixed(5);
                }
            } catch (e) {
                console.log("Error:", e);
            }
        }
        
        getData();
        setInterval(getData, 3000);
    </script>
</body>
</html>
